<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ServiceNow Workflow Tracker</title>
        <!-- add the css file -->
        <link rel="stylesheet" href="workflow_task.css">
    </head>
    <body>
        <main class="container">
            <div class="header">
                <div>
                    <h2 style="margin: 0;">Automated Remediation</h2>
                    <small style="color: var(--text-muted);">IT Service Management Automation</small>
                </div>
                <span id="statusBadge" class="badge idle">Idle</span>
            </div>
            <div class="controls">
                <input type="text" id="ticketId" value="INC-009842" placeholder="Ticket ID (e.g. INC-001)">
                <button id="runBtn" onclick="startWorkflow()">Run Workflow</button>
            </div>
            <div class="status-meta">
                <span id="currentStatusText">Waiting to trigger...</span>
                <div class="heartbeat-indicator">
                    <span class="dot" id="heartbeatDot"></span>
                    <span id="heartbeatText">Socket: Disconnected</span>
                </div>
            </div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="timeline" id="timeline">
                <!-- Log items will appear here dynamically -->
            </div>
        </main>
        <script>
            async function startWorkflow() {
                const ticketInput = document.getElementById("ticketId");
                const runBtn = document.getElementById("runBtn");
                const statusBadge = document.getElementById("statusBadge");
                const progressBar = document.getElementById("progressBar");
                const currentStatusText = document.getElementById("currentStatusText");
                const heartbeatDot = document.getElementById("heartbeatDot");
                const heartbeatText = document.getElementById("heartbeatText");
                const timeline = document.getElementById("timeline");

                //reset 
                timeline.innerHTML = "";
                progressBar.style.width = "0%";
                statusBadge.className = "badge in_progress";
                statusBadge.innerText = "In Progress";
                heartbeatDot.className = "dot pulse";
                heartbeatText.innerText = "Socket: Active";

                addLogEntry("Client initiated POST request...");

                try {
                    const response = await fetch("http://localhost:8080/workflows/track", {
                        method: "POST",
                        headers : {
                            "Content-Type": "application/json",
                            "Accept": "text/event-stream"
                        },
                        body: JSON.stringify({ticketId: ticketInput.value})
                    });
                    if(!response.ok) {
                        throw new Error(`HTTP Error: ${response.status}`)
                    }
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "";
                    while (true) {
                        //read, if done break, decode and get the events from the buffer
                        const {value, done} = await reader.read(); 
                        if (done) {
                            break;
                        }
                        buffer += decoder.decode(value, {stream: true});
                        const events = buffer.split("\n\n");

                        buffer = events.pop();
                        for (const rawEvent of events) {
                            const lines = rawEvent.split("\n");
                            for (const line of lines) {
                                const trimmedLine = line.trim();
                                if (trimmedLine.startsWith(":")) {
                                    triggerHeartbeatPulse();
                                    continue;
                                }
                                if (trimmedLine.startsWith("data:")) {
                                    const payload = JSON.parse(trimmedLine.substring(5).trim());
                                    progressBar.style.width = `${payload.percentage}`;
                                    currentStatusText.innerHTML = `${payload.percentage-payload.message}`;
                                    addLogEntry(payload.message);
                                    if (payload.status === "COMPLETED") {
                                        statusBadge.className = "badge completed";
                                        statusBadge.innerHTML = "Resolved";
                                    }
                                }
                            }
                        }
                    }
                } catch (error) {
                    addLogEntry(`Error: ${error.message}`);
                    statusBadge.className = "badge idle";
                    statusBadge.innerText = "Failed";
                } finally {
                    runBtn.disabled = false;
                    heartbeatDot.className = "dot";
                    heartbeatText.innerHTML = "Socket: Closed";
                }
            }
            function addLogEntry(message) {
                const timeline = document.getElementById("timeline");
                const now = new Date().toLocaleTimeString();
                const entry = document.createElement("div");
                entry.className = "log-entry";
                entry.innerHTML = `<span class="log-time">[${now}]</span><span class="log-msg">${message}</span>`;
                timeline.prepend(entry);
            }
            function triggerHeartbeatPulse() {
                const dot = document.getElementById("heartbeatDot");
                dot.style.transform = "scale(1.5)";
                setTimeout(() => {
                    dot.style.transform = "scale(1)"
                }, 300);
            }
        </script>
    </body>
</html>
